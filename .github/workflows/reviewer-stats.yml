name: Reviewer stats

# 只在 develop 上跑：每天北京 21:00 + 手动；不监听 pull_request_review（避免挂到学生 PR 且 fork 审阅 token 写 Issue 403）
on:
  schedule:
    # 13:00 UTC = 21:00 Asia/Shanghai
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      post_digest:
        description: "Also post a daily digest comment"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: reviewer-stats
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # GITHUB_TOKEN + issues: write；team 读失败回退 STATS_TEAM
      - name: Collect / update dashboard / optional digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_REPO: ${{ github.repository }}
          STATS_ISSUE: "173"
          STATS_CUTOFF: "2026-10-04T00:00:00+08:00"
          STATS_UPDATE_ISSUE: "1"
          # 定时必发日报；手动按勾选
          STATS_POST_DIGEST: ${{ github.event_name == 'schedule' && '1' || (inputs.post_digest && '1' || '0') }}
          STATS_TEAM: "MOLUOGH,MU-mu188,Pazburg,Return-leaf,hongwei-2026,hzc1045-web,isryanyhliu,jingdi0112,valacoynocecio475-prog,xwms"
        run: python ci/reviewer-stats/collect.py
