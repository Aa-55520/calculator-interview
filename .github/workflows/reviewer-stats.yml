name: Reviewer stats

# 统计审核次数；每天北京时间 21:00 发日报到 Issue #173
on:
  pull_request_review:
    types: [submitted]
  schedule:
    # 13:00 UTC = 21:00 Asia/Shanghai
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      post_digest:
        description: "Also post a daily digest comment"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: reviewer-stats
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect / update dashboard / optional digest
        env:
          GH_TOKEN: ${{ secrets.XWMS_PAT_TOKEN || secrets.GITHUB_TOKEN }}
          STATS_REPO: ${{ github.repository }}
          STATS_ISSUE: "173"
          STATS_CUTOFF: "2026-10-04T00:00:00+08:00"
          STATS_UPDATE_ISSUE: "1"
          # schedule 与手动默认发日报；单次 review 触发只更新总表
          STATS_POST_DIGEST: ${{ github.event_name == 'schedule' && '1' || (github.event_name == 'workflow_dispatch' && inputs.post_digest && '1' || '0') }}
          STATS_TEAM: "MOLUOGH,MU-mu188,Pazburg,Return-leaf,hongwei-2026,hzc1045-web,isryanyhliu,jingdi0112,valacoynocecio475-prog,xwms"
        run: python ci/reviewer-stats/collect.py
